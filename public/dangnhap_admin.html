<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Quản trị | Trường Tiểu học Lạc Quới</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #212529 0%, #495057 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Times New Roman", sans-serif;
      padding: 20px;
    }
    .login-card {
      background: white; border-radius: 16px; padding: 40px 30px;
      width: 100%; max-width: 450px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }
    .logo-box { text-align: center; margin-bottom: 25px; }
    .logo-img { height: 90px; margin-bottom: 15px; }
    .school-name {
      font-size: 28px; font-weight: bold; color: #212529;
      text-align: center; line-height: 1.3;
    }
    .page-subtitle { text-align: center; color: #666; font-size: 18px; margin: 10px 0 30px; }
    .form-label { font-weight: bold; color: #333; }
    .input-wrapper { position: relative; }
    .form-control {
      width: 100%; padding: 12px 45px 12px 15px;
      border-radius: 8px; border: 1px solid #ced4da; font-size: 16px;
    }
    .form-control:focus {
      border-color: #212529;
      box-shadow: 0 0 0 3px rgba(33,37,41,0.15); outline: none;
    }
    .btn-eye {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; font-size: 20px;
      color: #6c757d; cursor: pointer; padding: 0; line-height: 1;
    }
    .btn-eye:hover { color: #212529; }
    .btn-login {
      width: 100%; padding: 14px; background: #212529;
      color: white; border: none; border-radius: 8px;
      font-size: 18px; font-weight: bold; margin-top: 10px; transition: 0.2s;
    }
    .btn-login:hover { background: #000; transform: translateY(-2px); }
    .forgot-link { text-align: right; margin: 10px 0 20px; }
    .forgot-link a { color: #212529; text-decoration: none; }
    .forgot-link a:hover { text-decoration: underline; }
    .back-link { text-align: center; margin-top: 25px; }
    .back-link a { color: #212529; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
    .error-msg { color: #dc3545; text-align: center; margin-top: 15px; display: none; }
    .note-text { font-size: 13px; color: #888; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-box">
      <img src="logo_truong.png" alt="Logo Trường" class="logo-img" onerror="this.style.display='none'">
      <h1 class="school-name">TRƯỜNG TIỂU HỌC LẠC QUỚI</h1>
      <p class="page-subtitle">⚙️ Đăng nhập — Quản trị Hệ thống</p>
    </div>

    <form id="formDangNhap">
      <div class="mb-4">
        <label class="form-label">Tên đăng nhập</label>
        <input type="text" id="tenDangNhap" class="form-control" placeholder="Nhập tên tài khoản quản trị" required autocomplete="username">
      </div>

      <div class="mb-2">
        <label class="form-label">Mật khẩu</label>
        <div class="input-wrapper">
          <input type="password" id="matKhau" class="form-control" placeholder="Nhập mật khẩu" required autocomplete="current-password">
          <button type="button" class="btn-eye" id="btnConMat" title="Hiện/Ẩn mật khẩu">👁️</button>
        </div>
      </div>

      <div class="forgot-link">
        <a href="#" id="linkQuenMK">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn-login">Đăng Nhập Hệ Thống</button>
      <div class="error-msg" id="thongBaoLoi">Tên đăng nhập hoặc mật khẩu không đúng!<br>Chỉ quản trị viên mới được truy cập trang này.</div>
    </form>

    <p class="note-text">Tài khoản mặc định: <strong>quantri</strong> / <strong>lacquoi2026</strong></p>

    <div class="back-link">
      <a href="index.html">← Quay lại Trang chủ</a>
    </div>
  </div>

  <script src="du_lieu_chung.js"></script>
  <script>
    // === NÚT ẨN/HIỆN MẬT KHẨU ===
    const oMatKhau = document.getElementById('matKhau');
    const oBtnConMat = document.getElementById('btnConMat');
    let dangHien = false;
    oBtnConMat.addEventListener('click', function () {
      dangHien = !dangHien;
      oMatKhau.type = dangHien ? 'text' : 'password';
      oBtnConMat.textContent = dangHien ? '🙈' : '👁️';
    });

    // === ĐĂNG NHẬP → VÀO THẲNG TRANG QUẢN LÝ ===
    const formDangNhap = document.getElementById('formDangNhap');
    const thongBaoLoi = document.getElementById('thongBaoLoi');

    formDangNhap.addEventListener('submit', function (e) {
      e.preventDefault();
      thongBaoLoi.style.display = 'none';

      const ten = document.getElementById('tenDangNhap').value.trim();
      const mk = document.getElementById('matKhau').value.trim();

      const admin = DANH_SACH_GIAO_VIEN?.find(item =>
        item.tenDangNhap === ten &&
        item.matKhau === mk &&
        item.laAdmin === true
      );

      if (admin) {
        localStorage.setItem("dangNhap", JSON.stringify({
          id: admin.id,
          hoTen: admin.hoTen,
          laAdmin: true,
          thoiGian: new Date().toLocaleString('vi-VN')
        }));
        // VÀO THẲNG TRANG QUẢN LÝ luôn, không cần qua trang chủ
        window.location.href = "quanly.html";
      } else {
        thongBaoLoi.style.display = 'block';
        document.getElementById('matKhau').value = '';
        document.getElementById('matKhau').focus();
      }
    });

    // === Quên mật khẩu Admin ===
    document.getElementById('linkQuenMK').addEventListener('click', function (e) {
      e.preventDefault();
      alert('Để đặt lại mật khẩu Admin:\n1. Mở file du_lieu_chung.js\n2. Tìm tài khoản có "laAdmin: true"\n3. Sửa giá trị "matKhau" thành mật khẩu mới\n4. Lưu & cập nhật lên hệ thống.');
    });
  </script>
</body>
</html>
