<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Quản Trị - Trường Tiểu học Lạc Quới</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0;}
    body {
      background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Times New Roman", sans-serif;
      padding: 20px;
    }
    .login-card {
      background: white; border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      padding: 40px 35px; max-width: 500px; width: 100%; text-align: center;
    }
    .login-logo {height: 110px; margin-bottom: 20px;}
    .school-name {
      color: #2c3e50; font-weight: bold; margin-bottom: 8px;
      font-size: clamp(22px, 5vw, 32px); line-height: 1.2; word-break: keep-all;
    }
    .login-subtitle {color: #666; font-size: 18px; margin-bottom: 30px;}
    .form-label {font-weight: 600; font-size: 17px;}
    .form-control {padding: 12px 16px; font-size: 16px; border-radius: 8px; border: 1px solid #ced4da;}
    .btn-login {
      background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
      color: white; font-weight: bold; padding: 14px; border: none;
      width: 100%; border-radius: 8px; font-size: 18px; margin-top: 10px;
    }
    .btn-login:hover {opacity: 0.9; color: white;}
    .btn-back {margin-top: 20px; display: inline-block; color: #2c3e50; text-decoration: none; font-size: 16px;}
    .btn-back:hover {text-decoration: underline;}
    .alert {display: none; margin-top: 15px; text-align: left;}
    .luu-y {background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px 14px; border-radius: 4px; margin: 15px 0; text-align: left; font-size: 14px; color: #856404;}
  </style>
</head>
<body>
  <div class="login-card">
    <img src="logo_truong.png" alt="Logo Trường" class="login-logo">
    <h2 class="school-name" id="tenTruong">TIỂU HỌC LẠC QUỚI</h2>
    <p class="login-subtitle">⚙️ Đăng nhập — Quản trị Hệ thống</p>
    <div class="luu-y">🔒 Chỉ dành cho Quản trị viên được ủy quyền.</div>

    <form id="loginForm">
      <div class="mb-3 text-start">
        <label class="form-label">Tên đăng nhập Quản trị</label>
        <input type="text" id="username" class="form-control" placeholder="Nhập tài khoản quản trị" required>
      </div>
      <div class="mb-3 text-start">
        <label class="form-label">Mật khẩu</label>
        <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required>
      </div>
      <button type="submit" class="btn-login">Đăng Nhập Hệ Thống</button>
      <div class="alert alert-danger" id="errorAlert">❌ Tài khoản không phải Quản trị hoặc sai thông tin!</div>
    </form>

    <a href="index.html" class="btn-back">← Quay lại Trang chủ</a>
  </div>

  <script src="du_lieu_chung.js"></script>
  <script>
    document.getElementById("tenTruong").textContent = CAIDAT_HE_THONG.tenTruong;

    document.getElementById("loginForm").onsubmit = function(e) {
      e.preventDefault();
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value.trim();
      const admin = DANH_SACH_GIAO_VIEN.find(g => g.tenDangNhap === u && g.matKhau === p && g.laAdmin && g.trangThai === "hoatdong");
      
      if (admin) {
        localStorage.setItem("dangNhap", JSON.stringify({ ten: admin.hoTen, user: admin.tenDangNhap, laAdmin: true, maGV: admin.maGV }));
        ghiNhatKy(admin.hoTen, "Đăng nhập Quản trị", "Thành công");
        window.location.href = "quanly.html";
      } else {
        document.getElementById("errorAlert").style.display = "block";
      }
    };
  </script>
</body>
</html>
