<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Quản Trị - Trường Tiểu học Lạc Quới</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0052cc 0%, #0066ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Times New Roman", sans-serif;
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .login-logo {
      height: 90px;
      margin-bottom: 15px;
    }
    .login-title {
      font-weight: bold;
      color: #0b5ed7;
      margin-bottom: 5px;
    }
    .login-subtitle {
      color: #666;
      font-size: 15px;
      margin-bottom: 30px;
    }
    .form-label {
      font-weight: 600;
    }
    .btn-login {
      background: linear-gradient(135deg, #0052cc 0%, #0066ff 100%);
      color: white;
      font-weight: bold;
      padding: 12px;
      border: none;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .btn-login:hover {
      opacity: 0.9;
    }
    .btn-back {
      margin-top: 15px;
      display: inline-block;
      color: #0b5ed7;
      text-decoration: none;
      font-size: 15px;
    }
    .btn-back:hover {
      text-decoration: underline;
    }
    .alert {
      display: none;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <img src="logo_truong.png" alt="Logo Trường" class="login-logo">
    <h3 class="login-title">TRƯỜNG TIỂU HỌC LẠC QUỚI</h3>
    <p class="login-subtitle">👤 Đăng nhập — Giáo viên</p>

    <form id="loginForm">
      <div class="mb-3 text-start">
        <label class="form-label">Tên đăng nhập</label>
        <input type="text" id="username" class="form-control" placeholder="Nhập tên quản trị" required>
      </div>
      <div class="mb-3 text-start">
        <label class="form-label">Mật khẩu</label>
        <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required>
      </div>
      <button type="submit" class="btn-login">Đăng Nhập</button>
      
      <div class="alert alert-danger" id="errorAlert">
        Tên đăng nhập hoặc mật khẩu không đúng!
      </div>
    </form>

    <a href="index.html" class="btn-back">← Quay lại Trang chủ</a>
  </div>

  <script>
    // ===== Tài khoản Quản trị =====
    // Bạn có thể đổi tài khoản mật khẩu ở đây
    const adminAccount = {
      username: "Admin",
      password: "Admin@123"
    };

    const loginForm = document.getElementById('loginForm');
    const errorAlert = document.getElementById('errorAlert');

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (user === adminAccount.username && pass === adminAccount.password) {
        // Đăng nhập thành công → chuyển trang quản lý
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = "quanly.html";
      } else {
        // Sai thông tin → hiển thị lỗi
        errorAlert.style.display = "block";
      }
    });
  </script>
</body>
</html>
